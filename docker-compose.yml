services:
  postgres:
    image: postgres:16-alpine
    container_name: taskpilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
      POSTGRES_DB: taskpilot
    volumes:
      - taskpilot-postgres-data:/var/lib/postgresql/data

volumes:
  taskpilot-postgres-data:
